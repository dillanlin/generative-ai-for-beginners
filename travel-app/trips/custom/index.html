<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#FBEFE3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="我的旅程" />
  <title>我的旅程</title>

  <link rel="apple-touch-icon" href="../../engine/icon.svg" />
  <link rel="icon" href="../../engine/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="../../engine/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="topStack">
      <header class="hero" id="hero">
        <div class="hero__map" id="map" aria-label="行程地圖"></div>
        <div class="hero__mapHint">點圖釘看店家 · 可縮放</div>
        <div class="hero__scrim"></div>
        <div class="hero__text">
          <p class="hero__eyebrow" id="heroEyebrow"></p>
          <h1 class="hero__title" id="heroTitle"></h1>
          <p class="hero__range" id="heroRange"></p>
        </div>
        <svg class="hero__wave" viewBox="0 0 390 46" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#2FA8B5" fill-opacity=".85" d="M0 18c48-16 96 12 146 8s84-22 130-16 78 22 114 14v22H0z"/>
          <path fill="#FBEFE3" d="M0 28c52-14 92 10 146 6s86-20 132-14 76 20 112 12v14H0z"/>
        </svg>
      </header>
      <nav class="dayTabs" id="dayTabs" aria-label="選擇日期"></nav>
    </div>

    <main class="main" id="main" tabindex="-1"></main>

    <footer class="siteFoot">
      <svg class="siteFoot__art" viewBox="0 0 260 70" aria-hidden="true">
        <circle cx="222" cy="18" r="10" fill="#F6C453"/>
        <g fill="none" stroke="#2FA8B5" stroke-width="3" stroke-linecap="round">
          <path d="M6 52c12-10 24 10 36 0s24 10 36 0 24 10 36 0 24 10 36 0 24 10 36 0 24 10 36 0"/>
          <path d="M6 62c12-10 24 10 36 0s24 10 36 0 24 10 36 0 24 10 36 0 24 10 36 0 24 10 36 0"/>
        </g>
        <g>
          <path d="M118 40c0-16 13-25 26-25s26 9 26 25z" fill="#2FA8B5"/>
          <path d="M144 40v14" stroke="#12365B" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g fill="#12365B">
          <rect x="30" y="30" width="46" height="14" rx="5"/>
          <path d="M38 30l7-9h20l7 9z"/>
          <circle cx="42" cy="46" r="5"/><circle cx="66" cy="46" r="5"/>
        </g>
      </svg>
      <p class="siteFoot__note" id="footNote"></p>
      <p class="siteFoot__home"><a href="../../index.html">← 所有旅程</a></p>
    </footer>

    <button class="fab" id="fab" type="button" aria-label="打開工具箱">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="3" y="7" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 12.5h18M10.5 12.5h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <form method="dialog" id="sheetForm" class="sheet__form">
      <div class="sheet__head">
        <h2 class="sheet__title" id="sheetTitle">編輯</h2>
        <button class="sheet__close" value="cancel" type="submit" aria-label="關閉">✕</button>
      </div>
      <div class="sheet__body" id="sheetBody"></div>
      <div class="sheet__foot">
        <button class="btn btn--ghost" value="cancel" type="submit">取消</button>
        <button class="btn btn--primary" value="save" type="submit" id="sheetSave">儲存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../../engine/app.js"></script>
</body>
</html>
